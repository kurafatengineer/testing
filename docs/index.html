<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>UPSC CSE Test Series 2027</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:#ffffff; --ink:#0a0a0a; --muted:#6b6b6b; --line:#e4e4e4; --card:#fafafa;
    --inv-bg:#0a0a0a; --inv-ink:#ffffff; --ok:#15803d; --ok-bg:#eefaf1; --ok-line:#b7e4c4; --bad:#b91c1c; --bad-bg:#fff1f1; --bad-line:#f3b8b8;
    --shadow:0 10px 30px rgba(0,0,0,.12); --link:#1a6cf0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#000000; --ink:#f5f5f5; --muted:#8e8e8e; --line:#262626; --card:#0e0e0e;
      --inv-bg:#f5f5f5; --inv-ink:#000000; --ok:#4ade80; --ok-bg:#08170d; --ok-line:#1b4d2b; --bad:#f87171; --bad-bg:#1a0808; --bad-line:#5c1d1d;
      --shadow:0 10px 30px rgba(0,0,0,.6); --link:#7ab0ff;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    padding-bottom:calc(120px + env(safe-area-inset-bottom)); }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .wrap { max-width:640px; margin:0 auto; padding:0 16px; }
  svg { display:block; flex:none; }

  /* ---------- header ---------- */
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:saturate(180%) blur(14px); -webkit-backdrop-filter:saturate(180%) blur(14px);
    padding-top:env(safe-area-inset-top); padding-bottom:12px; }
  h1 { margin:0; padding:16px 0 6px; text-align:center; font-size:20px; font-weight:750; letter-spacing:-.02em; }
  .row { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:8px 0; align-items:center; }
  .row::-webkit-scrollbar { display:none; }
  .row > :first-child { margin-left:auto; } .row > :last-child { margin-right:auto; }   /* centre when it fits, scroll when not */
  .pill { flex:none; min-height:40px; padding:0 18px; border-radius:999px; border:1px solid var(--line);
    background:transparent; color:var(--ink); font-size:14.5px; font-weight:550; white-space:nowrap; }
  .pill[aria-selected="true"] { background:var(--inv-bg); color:var(--inv-ink); border-color:var(--inv-bg); }
  .round { flex:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:transparent;
    display:grid; place-items:center; color:var(--muted); }

  .search { position:relative; margin-top:2px; perspective:900px; }
  .search .ico { position:absolute; left:16px; top:14px; color:var(--muted); pointer-events:none; }
  .search input { width:100%; height:48px; padding:0 44px 0 44px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); outline:none; font-size:16px; }
  .search input:focus { border-color:var(--ink); }
  .search input { -webkit-appearance:none; appearance:none; }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance:none; display:none; }
  .clear { position:absolute; right:7px; top:7px; width:34px; height:34px; border-radius:50%; border:0; background:transparent;
    color:var(--muted); display:grid; place-items:center; }
  .suggest { position:absolute; left:0; right:0; top:54px; max-height:min(52vh, 340px); overflow-y:auto; background:var(--bg);
    border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:6px; z-index:20;
    transform-origin:50% 0; animation:unfold .34s cubic-bezier(.2,.9,.25,1); }
  @keyframes unfold { from { opacity:0; transform:rotateX(-70deg) translateY(-10px); } to { opacity:1; transform:none; } }
  .sg { width:100%; display:flex; align-items:center; gap:10px; min-height:48px; padding:6px 12px; border:0; border-radius:16px;
    background:transparent; text-align:left; }
  .sg:active, .sg:hover { background:var(--card); }
  .sg .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:550; }
  .sg .d { flex:none; color:var(--muted); font-size:12px; }
  .sg .ok { flex:none; color:var(--ok); }
  .sg.site { color:var(--muted); border-top:1px solid var(--line); border-radius:0 0 16px 16px; margin-top:4px; }
  .hint { text-align:center; color:var(--muted); font-size:13px; margin:10px 0 0; }

  /* ---------- tiles ---------- */
  ul { list-style:none; margin:0; padding:0; }
  .item { display:grid; grid-template-columns:26px minmax(0,1fr) 46px; gap:12px; align-items:center; padding:14px;
    margin-top:10px; border:1px solid var(--line); border-radius:22px; background:var(--card); }
  .item.sent { background:var(--ok-bg); border-color:var(--ok-line); }
  .item.bad { background:var(--bad-bg); border-color:var(--bad-line); }
  .item.flash { animation:flash 1.6s ease; }
  @keyframes flash { 0%,60% { box-shadow:0 0 0 3px var(--ink); } 100% { box-shadow:0 0 0 3px transparent; } }
  .mark { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; border:1.5px solid var(--line); color:transparent; }
  .item.sent .mark { background:var(--ok); border-color:var(--ok); color:#fff; }
  .item.bad .mark { background:var(--bad); border-color:var(--bad); color:#fff; }
  .item.sending .mark { border-color:var(--ink); border-top-color:transparent; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .name { overflow:hidden; white-space:nowrap; font-weight:620; font-size:15.5px; letter-spacing:-.005em; }
  .name .t { display:inline-block; }
  .name.scroll { -webkit-mask-image:linear-gradient(90deg,#000 86%,transparent); mask-image:linear-gradient(90deg,#000 86%,transparent); }
  .name.scroll .t { animation:slide var(--dur,8s) ease-in-out 1.2s infinite alternate; }
  @keyframes slide { from { transform:translateX(0); } to { transform:translateX(var(--d)); } }
  .meta { display:flex; align-items:center; gap:8px; margin-top:4px; color:var(--muted); font-size:13px; }
  .state { font-weight:600; }
  .item.sent .state { color:var(--ok); }
  .item.bad .state { color:var(--bad); }
  .reason { margin-top:4px; font-size:12.5px; line-height:1.35; color:var(--bad); font-weight:550; }
  .post { width:28px; height:28px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; color:var(--muted);
    text-decoration:none; margin-left:auto; }
  .send { width:46px; height:46px; border-radius:50%; border:0; background:var(--inv-bg); color:var(--inv-ink); display:grid; place-items:center; }
  .item.sent .send { background:var(--ok); color:#fff; }
  .item.bad .send { background:var(--bad); color:#fff; }
  .sg .bad { flex:none; color:var(--bad); }
  .send:disabled { opacity:.4; cursor:default; }

  .empty, .error { text-align:center; color:var(--muted); padding:48px 16px; }
  .error { color:var(--bad); }
  .more { display:block; width:100%; min-height:46px; margin-top:14px; border-radius:999px; border:1px solid var(--line); background:transparent; font-weight:500; }
  .skeleton { height:76px; margin-top:10px; border-radius:22px; background:linear-gradient(90deg,var(--card),var(--line),var(--card));
    background-size:200% 100%; animation:sh 1.4s ease infinite; }
  @keyframes sh { from { background-position:200% 0; } to { background-position:-200% 0; } }
  .linkbtn { background:none; border:0; color:var(--muted); text-decoration:underline; padding:8px 2px; font-size:13px; }

  /* ---------- floating send, add-site panel, toast ---------- */
  .fab { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:8;
    display:flex; align-items:center; gap:10px; min-height:54px; padding:0 24px 0 20px; border:0; border-radius:999px;
    background:var(--inv-bg); color:var(--inv-ink); font-weight:650; font-size:16px; box-shadow:var(--shadow); white-space:nowrap; }
  .fab:disabled { opacity:.55; }
  /* add-website box: the round + grows into this in the same row */
  .row.adding > * { margin:0; }
  .addbox { flex:1; min-width:0; height:44px; display:flex; align-items:center; gap:10px; padding:0 5px 0 12px;
    border:1px solid var(--ink); border-radius:999px; background:var(--card); overflow:hidden;
    animation:expand .32s cubic-bezier(.2,.8,.2,1); }
  @keyframes expand { from { max-width:44px; opacity:.4; } to { max-width:700px; opacity:1; } }
  .fav { flex:none; width:24px; height:24px; display:grid; place-items:center; color:var(--muted); }
  .fav img { width:20px; height:20px; border-radius:5px; display:block; }
  .addbox input { flex:1; min-width:0; height:100%; border:0; outline:none; background:transparent; font-size:16px;
    text-overflow:ellipsis; -webkit-appearance:none; appearance:none; }
  .addbox input.has { color:var(--link); }
  .go { flex:none; width:34px; height:34px; border-radius:50%; border:0; background:transparent; color:var(--muted);
    display:grid; place-items:center; transition:background .2s, color .2s; }
  .addbox.valid .go { background:var(--ok); color:#fff; }
  .addbox.busy .go { background:transparent; border:2.5px solid var(--line); border-top-color:var(--ink); animation:spin .8s linear infinite; }
  .addbox.busy .go svg { display:none; }
  #toast { position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom)); transform:translate(-50%,24px);
    width:min(92vw, 560px); padding:14px 18px; border-radius:20px; background:var(--inv-bg); color:var(--inv-ink);
    font-size:14px; line-height:1.4; opacity:0; pointer-events:none; transition:.25s; z-index:30; text-align:center; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
    .name .t { display:block; overflow:hidden; text-overflow:ellipsis; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>UPSC CSE Test Series 2027</h1>
    <div class="row" id="sites" role="tablist" aria-label="Websites"></div>
    <div class="search">
      <span class="ico" id="icoSearch" aria-hidden="true"></span>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Search files, e.g. Vision, Test 5" aria-label="Search files" aria-controls="suggest" aria-autocomplete="list">
      <button class="clear" id="clear" hidden aria-label="Clear search"></button>
      <div class="suggest" id="suggest" role="listbox" hidden></div>
    </div>
    <p class="hint" id="hint" hidden></p>
  </div>
</header>

<main class="wrap">
  <ul id="list" aria-live="polite"></ul>
  <div id="foot"></div>
</main>
<button class="fab" id="sendNew" hidden></button>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); try { tg.expand(); } catch (e) {} }

/* ------------------------------ settings ------------------------------ */
const YEAR = "2027";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRP4WC23dmnYcUwD16HnSe3eUPwDytA9MhKl0SgccbeVLqpZV-dS6gcL8JW8L5cBaS/exec";
const BUILTIN = [                                  // add more websites here
  { name: "UPSC PDF", url: "https://upscpdf.com" },
  { name: "Free UPSC", url: "https://freeupsc.org" }
];
const PAGE = 50, BATCH = 8, MAX_SUGGEST = 6;
const FILE_RE = /drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{10,})/g;
const FOLDER_RE = /https?:\/\/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/[A-Za-z0-9_-]{10,}/g;

/* ------------------------------ helpers ------------------------------ */
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, ""); else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
}
const ICONS = {
  send:   ["M22 2 11 13", "M22 2l-7 20-4-9-9-4 20-7z"],
  plus:   ["M12 5v14", "M5 12h14"],
  search: ["M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z", "m20 20-3.5-3.5"],
  check:  ["M5 12.5l4.5 4.5L19 7"],
  link:   ["M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6", "M15 3h6v6", "M10 14 21 3"],
  close:  ["M6 6l12 12", "M18 6 6 18"],
  alert:  ["M12 7v6", "M12 17.2v.01"],
  arrow:  ["M5 12h14", "M13 6l6 6-6 6"],
  globe:  ["M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z", "M3 12h18", "M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"]
};
function icon(name, size = 18, width = 2) {
  const NS = "http://www.w3.org/2000/svg", s = document.createElementNS(NS, "svg");
  for (const [k, v] of Object.entries({ width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
    "stroke-width": width, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) s.setAttribute(k, v);
  ICONS[name].forEach(d => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); s.append(p); });
  return s;
}
const decode = html => new DOMParser().parseFromString(html || "", "text/html").documentElement.textContent.trim();
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";
const fmtDate = t => t ? new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";

let toastTimer;
function toast(msg, ms = 4500) { const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); if (ms) toastTimer = setTimeout(() => t.classList.remove("on"), ms); }

async function getJson(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

/* ------------------------------ state ------------------------------ */
let customSites = store.get("sites", []).filter(s => s && /^https:\/\//.test(s.url));
const allSites = () => BUILTIN.concat(customSites);
let cur = Math.min(Math.max(store.get("cur", 0), 0), allSites().length - 1);
const data = new Map();            // site url -> {items: Map, page, done, loading, error}
let seen = new Set(), seenKnown = false;
let issues = {};                   // post key -> why its PDF could not be sent (kept by the Apps Script)
const failedNow = new Set();       // posts that failed to send in this session
let query = "", suggestOpen = false, flashId = null;
const sending = new Set();
let busy = false;

const site = () => allSites()[cur];
const host = s => new URL(s.url).hostname.replace(/^www\./, "");
const api = s => s.url.replace(/\/$/, "") + "/wp-json/wp/v2";
// upscpdf.com ids were saved as plain numbers earlier; other websites are prefixed with their host name.
const keyOf = (s, id) => host(s) === "upscpdf.com" ? String(id) : host(s) + ":" + id;
const stateOf = s => { if (!data.has(s.url)) data.set(s.url, { items: new Map(), page: 0, done: false, loading: false, error: "" }); return data.get(s.url); };
const isSent = i => seenKnown && seen.has(i.key);
const tidy = t => t.replace(/\b1 file\(s\)/, "1 file").replace(/\b(\d+) file\(s\)/, "$1 files");
const problemOf = i => issues[i.key] || (failedNow.has(i.key) ? "Sending failed - tap the red button to retry" : "");

/* ------------------------------ loading posts ------------------------------ */
async function fetchPosts(s, search, page) {
  const u = api(s) + "/posts?per_page=" + PAGE + "&page=" + page + "&orderby=date&order=desc" +
    "&search_columns=post_title&search=" + encodeURIComponent(search) + "&_fields=id,date_gmt,link,title";
  const list = await getJson(u);
  return { raw: list.length, items: list.map(p => ({
    id: p.id, key: keyOf(s, p.id), title: decode(p.title && p.title.rendered), link: p.link,
    time: p.date_gmt ? Date.parse(p.date_gmt + "Z") : 0 })).filter(i => i.title.includes(YEAR)) };
}

async function loadMore() {
  const s = site(), st = stateOf(s);
  if (st.loading || st.done) return;
  st.loading = true; st.error = ""; render();
  try {
    const r = await fetchPosts(s, YEAR, st.page + 1);
    st.page++; r.items.forEach(i => st.items.set(i.id, Object.assign(st.items.get(i.id) || {}, i)));
    if (r.raw < PAGE) st.done = true;
  } catch (e) { st.error = "Could not load the list (" + e.message + ")"; }
  st.loading = false; render();
}

async function serverSearch() {
  const s = site(), st = stateOf(s), q = query.trim();
  if (!q) return;
  toast("Searching the website...", 0);
  try {
    const r = await fetchPosts(s, q + " " + YEAR, 1);
    let added = 0;
    r.items.forEach(i => { if (!st.items.has(i.id)) { st.items.set(i.id, i); added++; } });
    toast(added ? added + " more file" + (added > 1 ? "s" : "") + " found" : "Nothing found on the website either");
  } catch (e) { toast("Search failed: " + e.message); }
  render();
}

async function ensureContent(s, items) {
  const need = items.filter(i => !i.files);
  for (let k = 0; k < need.length; k += 40) {
    const part = need.slice(k, k + 40);
    const rows = await getJson(api(s) + "/posts?per_page=40&include=" + part.map(i => i.id).join(",") + "&_fields=id,content");
    const by = new Map(rows.map(r => [r.id, (r.content && r.content.rendered) || ""]));
    part.forEach(i => { const html = by.get(i.id) || "";
      i.files = [...new Set([...html.matchAll(FILE_RE)].map(m => m[1]))];
      i.folders = [...new Set(html.match(FOLDER_RE) || [])]; });
  }
}

/* ------------------------------ Apps Script ------------------------------ */
async function callScript(body) {
  if (!tg || !tg.initData) throw new Error("Open this page from the Telegram bot menu");
  const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ initData: tg.initData }, body)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "Unknown error");
  return j;
}

async function refreshStatus() {
  try { const j = await callScript({ action: "status" }); seen = new Set(j.seen); issues = j.issues || {}; seenKnown = true; }
  catch (e) { seenKnown = false; if (tg && tg.initData) toast("Could not load the sent status: " + e.message); }
  render();
}

async function sendItems(items, force) {
  if (busy) { toast("Please wait for the current send to finish"); return; }
  if (!items.length) return;
  busy = true; const s = site(); items.forEach(i => sending.add(i.key)); render();
  let sent = 0, failed = 0;
  try {
    for (let k = 0; k < items.length; k += BATCH) {
      const part = items.slice(k, k + BATCH);
      toast("Sending " + Math.min(k + BATCH, items.length) + " of " + items.length + "... keep this page open", 0);
      await ensureContent(s, part);
      const j = await callScript({ action: "send", force: !!force, posts: part.map(i => ({
        id: i.key, title: i.title, link: i.link, time: i.time, files: i.files, folders: i.folders })) });
      j.done.forEach(id => { seen.add(id); failedNow.delete(id); }); (j.failedIds || []).forEach(id => failedNow.add(id));
      if (j.issues) issues = j.issues;
      sent += j.sent; failed += j.failed;
      part.forEach(i => sending.delete(i.key));
      if (j.left) { failed += j.left; break; }
      render();
    }
    toast(sent ? "Sent " + sent + " post" + (sent > 1 ? "s" : "") + " to Telegram" + (failed ? " - " + failed + " left, tap again" : "")
               : failed ? "Nothing could be sent, please try again" : "Nothing new to send");
  } catch (e) { toast(e.message, 8000); }
  items.forEach(i => sending.delete(i.key)); busy = false; render();
}

/* ------------------------------ rendering ------------------------------ */
function matching(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  return [...stateOf(site()).items.values()].filter(i => words.every(w => i.title.toLowerCase().includes(w))).sort((a, b) => b.time - a.time);
}
const visible = () => matching(query);

function renderSites() {
  const box = $("sites");
  box.classList.toggle("adding", adding);
  if (adding) {
    if (!box.querySelector(".addbox")) { const a = buildAdd(); box.replaceChildren(a.box); a.input.focus(); }
    return;
  }
  box.replaceChildren();
  allSites().forEach((s, n) => box.append(h("button", { class: "pill", role: "tab", "aria-selected": String(n === cur),
    onclick: () => { cur = n; store.set("cur", n); query = ""; $("q").value = ""; render(); if (!stateOf(site()).page) loadMore(); } }, s.name || host(s))));
  box.append(h("button", { class: "round", "aria-label": "Add a website", title: "Add a website",
    onclick: () => { adding = true; renderSites(); } }, icon("plus", 20, 2.2)));
  const on = box.querySelector('[aria-selected="true"]');          // keep the chosen website in view
  if (on) requestAnimationFrame(() => { try { on.scrollIntoView({ inline: "center", block: "nearest" }); } catch (e) {} });
}

function renderSuggest() {
  const box = $("suggest"), q = query.trim();
  box.replaceChildren();
  if (!suggestOpen || !q) { box.hidden = true; return; }
  const found = matching(q);
  found.slice(0, MAX_SUGGEST).forEach(i => box.append(h("button", { class: "sg", role: "option", onclick: () => pick(i) },
    h("span", { class: "t" }, i.title), problemOf(i) ? h("span", { class: "bad" }, icon("alert", 16, 3)) : isSent(i) ? h("span", { class: "ok" }, icon("check", 16, 3)) : h("span", { class: "d" }, fmtDate(i.time)))));
  if (found.length > MAX_SUGGEST) box.append(h("div", { class: "sg", style: "color:var(--muted);min-height:36px" }, "+" + (found.length - MAX_SUGGEST) + " more below"));
  box.append(h("button", { class: "sg site", onclick: () => { suggestOpen = false; serverSearch(); } },
    icon("search", 16), h("span", { class: "t" }, "Search “" + q + "” on the website")));
  box.hidden = false;
}

function pick(i) {
  query = i.title; $("q").value = i.title; suggestOpen = false; flashId = i.key; $("q").blur(); render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function fitNames() {
  document.querySelectorAll(".name").forEach(n => {
    const t = n.firstElementChild; if (!t) return;
    n.classList.remove("scroll");
    const over = t.scrollWidth - n.clientWidth;
    if (over > 2) { n.classList.add("scroll"); t.style.setProperty("--d", -(over + 12) + "px"); t.style.setProperty("--dur", Math.max(5, over / 28) + "s"); }
  });
}

function card(i) {
  const isSending = sending.has(i.key), problem = isSending ? "" : problemOf(i);
  const sent = isSent(i) && !problem;
  const el = h("li", { class: "item" + (sent ? " sent" : "") + (problem ? " bad" : "") + (isSending ? " sending" : "") + (flashId === i.key ? " flash" : "") },
    h("div", { class: "mark", "aria-hidden": "true" }, isSending ? null : problem ? icon("alert", 16, 3) : sent ? icon("check", 14, 3.4) : null),
    h("div", { style: "min-width:0" },
      h("div", { class: "name", title: i.title }, h("span", { class: "t" }, i.title)),
      h("div", { class: "meta" }, h("span", {}, fmtDate(i.time)),
        !problem && (seenKnown || isSending) ? h("span", { class: "state" }, isSending ? "Sending..." : sent ? "Sent" : "New") : null,
        h("a", { class: "post", href: safeUrl(i.link), target: "_blank", rel: "noopener", "aria-label": "Open the website post", title: "Open the website post" }, icon("link", 14))),
      problem ? h("div", { class: "reason" }, tidy(problem)) : null),
    h("button", { class: "send", disabled: busy, "aria-label": problem ? "Try sending again" : sent ? "Send again to Telegram" : "Send to Telegram",
      title: problem ? "Try sending again" : sent ? "Send again to Telegram" : "Send to Telegram", onclick: () => sendItems([i], isSent(i)) }, icon("send", 20)));
  return el;
}

function render() {
  renderSites();
  $("icoSearch").replaceChildren(icon("search", 18));
  $("clear").replaceChildren(icon("close", 18)); $("clear").hidden = !query;
  const s = site(), st = stateOf(s), list = visible();

  const hint = $("hint");
  hint.hidden = !!(tg && tg.initData);
  hint.textContent = "Open this page from the Telegram bot menu to send files.";

  const fresh = seenKnown ? [...st.items.values()].filter(i => !seen.has(i.key)) : [];
  const fab = $("sendNew");
  fab.hidden = !fresh.length;
  fab.disabled = busy;
  fab.replaceChildren(icon("send", 20), busy ? "Sending..." : "Send " + fresh.length + " new");

  const ul = $("list"); ul.replaceChildren();
  if (st.loading && !st.items.size) for (let n = 0; n < 5; n++) ul.append(h("li", { class: "skeleton" }));
  list.forEach(i => ul.append(card(i)));
  const foot = $("foot"); foot.replaceChildren();
  if (st.error) foot.append(h("div", { class: "error" }, st.error, h("br"), h("button", { class: "linkbtn", onclick: loadMore }, "Try again")));
  else if (!st.loading && !list.length) foot.append(h("div", { class: "empty" }, query ? "No files match your search." : "No files found."));
  if (query.trim() && !st.loading && !list.length) foot.append(h("button", { class: "more", onclick: serverSearch }, "Search “" + query.trim() + "” on the website"));
  if (!st.done && !st.loading && !st.error && st.items.size && !query) foot.append(h("button", { class: "more", onclick: loadMore }, "Show older files"));
  if (st.loading && st.items.size) foot.append(h("div", { class: "empty" }, "Loading..."));
  if (cur >= BUILTIN.length) foot.append(h("button", { class: "linkbtn", style: "display:block;margin:16px auto 0", onclick: removeSite }, "Remove this website"));

  renderSuggest();
  requestAnimationFrame(() => { fitNames(); if (flashId) setTimeout(() => { flashId = null; }, 1700); });
}

/* ------------------------------ adding websites ------------------------------ */
let adding = false, addBusy = false;
function parseSite(v) {
  v = (v || "").trim(); if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  let u; try { u = new URL(v); } catch (e) { return null; }
  if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(u.hostname)) return null;
  const name = u.hostname.replace(/^www\./, "");
  return { name, url: "https://" + u.hostname, short: name + (u.pathname.length > 1 ? u.pathname.replace(/\/$/, "") : "") };
}
function closeAdd() { adding = false; renderSites(); }

function buildAdd() {
  const fav = h("span", { class: "fav" }, icon("globe", 20));
  const input = h("input", { id: "siteUrl", type: "url", inputmode: "url", autocapitalize: "off", autocomplete: "off",
    spellcheck: "false", placeholder: "Paste website link", "aria-label": "Website link" });
  const go = h("button", { class: "go", "aria-label": "Cancel" }, icon("close", 18));
  const box = h("div", { class: "addbox" }, fav, input, go);
  let shown = null, valid = false;
  function sync() {
    const p = parseSite(input.value);
    box.classList.toggle("valid", !!p); input.classList.toggle("has", !!p);
    if (valid !== !!p) {                       // swap the icon only when the state really changes (else a tap can get lost)
      valid = !!p;
      go.replaceChildren(icon(valid ? "arrow" : "close", valid ? 20 : 18, valid ? 2.6 : 2));
      go.setAttribute("aria-label", valid ? "Add this website" : "Cancel");
    }
    const name = p ? p.name : "";
    if (name !== shown) {
      shown = name;
      if (!name) fav.replaceChildren(icon("globe", 20));
      else { const img = h("img", { src: "https://" + name + "/favicon.ico", alt: "", width: 20, height: 20, referrerpolicy: "no-referrer" });
             img.addEventListener("error", () => fav.replaceChildren(icon("globe", 20))); fav.replaceChildren(img); }
    }
    return p;
  }
  function shorten() { const p = parseSite(input.value); if (p) input.value = p.short; sync(); }
  async function submit() {
    const p = parseSite(input.value); if (!p || addBusy) return;
    if (allSites().some(x => host(x) === p.name)) { toast("This website is already added"); return; }
    addBusy = true; box.classList.add("busy");
    try { await getJson(api(p) + "/posts?per_page=1&_fields=id"); }
    catch (e) { addBusy = false; box.classList.remove("busy");
      toast("Could not open this website, or it is not WordPress (" + e.message + ")", 7000); return; }
    addBusy = false;
    customSites.push({ name: p.name, url: p.url }); store.set("sites", customSites);
    cur = allSites().length - 1; store.set("cur", cur); adding = false; query = ""; $("q").value = "";
    toast(p.name + " added"); render(); loadMore();
  }
  input.addEventListener("input", sync);
  input.addEventListener("paste", () => setTimeout(shorten, 0));
  input.addEventListener("blur", () => { shorten(); setTimeout(() => { if (!input.value.trim() && !box.contains(document.activeElement) && !addBusy) closeAdd(); }, 150); });
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } if (e.key === "Escape") closeAdd(); });
  go.addEventListener("click", () => { if (parseSite(input.value)) submit(); else closeAdd(); });
  return { box, input };
}
function removeSite() {
  if (cur < BUILTIN.length || !confirm("Remove " + site().name + "?")) return;
  customSites.splice(cur - BUILTIN.length, 1); store.set("sites", customSites); cur = 0; store.set("cur", 0); render();
}

/* ------------------------------ start ------------------------------ */
$("q").addEventListener("input", e => { query = e.target.value; suggestOpen = true; render(); });
$("q").addEventListener("focus", () => { suggestOpen = true; renderSuggest(); });
$("q").addEventListener("blur", () => { setTimeout(() => { suggestOpen = false; renderSuggest(); }, 200); });
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter") { suggestOpen = false; e.target.blur(); render(); if (!visible().length) serverSearch(); }
  if (e.key === "Escape") { suggestOpen = false; renderSuggest(); }
});
$("clear").addEventListener("click", () => { query = ""; $("q").value = ""; suggestOpen = false; render(); });
$("sendNew").addEventListener("click", () => sendItems([...stateOf(site()).items.values()].filter(i => !seen.has(i.key)).sort((a, b) => b.time - a.time), false));
window.addEventListener("resize", fitNames);

render(); loadMore(); refreshStatus();
</script>
</body>
</html>
