<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPSC Test Series</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --ok:#0a7d32; --bad:#c62828; --card:#f3f3f3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17212b; --fg:#eee; --muted:#9aa; --card:#22303c; --ok:#4cd07d; --bad:#ff6b6b; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  button { width:100%; padding:14px; font-size:16px; border:0; border-radius:10px; background:#2a9df4; color:#fff; }
  .card { background:var(--card); border-radius:10px; padding:12px; margin-top:12px; word-break:break-word; }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; }
  small { color:var(--muted); }
  a { color:#2a9df4; }
  .links a { display:block; margin-top:6px; }
</style>
</head>
<body>
<h1>UPSC Prelims Test Series 2027</h1>
<p><small>upscpdf.com की सबसे नई पोस्ट और उनकी Drive फ़ाइलें।</small></p>
<button id="send">📥 आज की सारी नई फ़ाइलें Telegram पर भेजें</button>
<p><small>दबाने पर जो फ़ाइलें अब तक आपको नहीं मिलीं, वे सब Telegram पर आ जाएँगी (कुछ मिनट लग सकते हैं, पेज खुला रखिए)।</small></p>
<div id="status"></div>
<button id="go" style="background:#555;margin-top:8px">सूची ताज़ा करें</button>
<div id="out"></div>
<script>
const tg = window.Telegram && Telegram.WebApp; if (tg) tg.ready();
const API = "https://upscpdf.com/wp-json/wp/v2";
const CATEGORY = "Prelims TEST Series", YEAR = "2027";
const out = document.getElementById("out");
const FILE_RE = /drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{10,})/g;
const FOLDER_RE = /https?:\/\/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/[A-Za-z0-9_-]{10,}/g;
const text = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent.trim(); };
function card() { const d = document.createElement("div"); d.className = "card"; out.appendChild(d); return d; }
function note(msg, cls) { const d = card(); const s = document.createElement("span"); if (cls) s.className = cls; s.textContent = msg; d.appendChild(s); }
function link(parent, href, label) { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = label; parent.appendChild(a); }
async function getJson(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }

// Apps Script Web App का /exec पता। खाली हो तो पहली बार पूछेगा और फ़ोन में याद रखेगा।
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRP4WC23dmnYcUwD16HnSe3eUPwDytA9MhKl0SgccbeVLqpZV-dS6gcL8JW8L5cBaS/exec";
let LAST = [];
const statusBox = document.getElementById("status");
function setStatus(msg, cls) { statusBox.innerHTML = ""; const d = document.createElement("div"); d.className = "card" + (cls ? " " + cls : ""); d.textContent = msg; statusBox.appendChild(d); }
function scriptUrl() {
  let u = APPS_SCRIPT_URL;
  try { u = u || localStorage.getItem("scriptUrl") || ""; } catch (e) {}
  if (!u) {
    u = (prompt("Apps Script Web App का /exec वाला पता paste कीजिए:") || "").trim();
    if (u) { try { localStorage.setItem("scriptUrl", u); } catch (e) {} }
  }
  return u;
}
document.getElementById("send").onclick = async () => {
  const url = scriptUrl();
  if (!url) { setStatus("❌ Web App का पता चाहिए", "bad"); return; }
  if (!tg || !tg.initData) { setStatus("❌ इसे Telegram के अंदर बॉट के मेन्यू से खोलिए", "bad"); return; }
  if (!LAST.length) { setStatus("पोस्ट की सूची लोड हो रही है..."); await load(); }
  if (!LAST.length) { setStatus("❌ भेजने के लिए कोई पोस्ट नहीं मिली", "bad"); return; }
  setStatus("भेज रहा हूँ... " + LAST.length + " पोस्ट जाँच रहा हूँ, पेज खुला रखिए");
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ initData: tg.initData, posts: LAST }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "अज्ञात गड़बड़ी");
    setStatus("✅ " + j.sent + " पोस्ट भेजी गईं, " + j.already + " पहले ही आ चुकी थीं" +
      (j.failed ? ", " + j.failed + " फेल (दोबारा दबाइए)" : "") +
      (j.left ? ", " + j.left + " बाकी (फिर से दबाइए)" : ""), j.failed || j.left ? "bad" : "ok");
  } catch (e) {
    setStatus("❌ " + e.message + " (Telegram में फ़ाइलें आई हों तो देख लीजिए)", "bad");
  }
};
async function load() {
  out.innerHTML = "";
  note("लोड हो रहा है...");
  try {
    const cats = await getJson(API + "/categories?per_page=100&search=" + encodeURIComponent(CATEGORY));
    const cat = cats.find(c => text(c.name).toLowerCase() === CATEGORY.toLowerCase());
    if (!cat) throw new Error("category नहीं मिली");
    const posts = await getJson(API + "/posts?categories=" + cat.id + "&per_page=30&_fields=id,date_gmt,link,title,content");
    out.innerHTML = "";
    const wanted = posts.filter(p => text(p.title.rendered).includes(YEAR));
    if (!wanted.length) { note("2027 वाली कोई पोस्ट नहीं मिली"); return; }
    LAST = wanted.map(p => {
      const html = (p.content && p.content.rendered) || "";
      return { id: String(p.id), title: text(p.title.rendered), link: p.link,
               time: new Date(p.date_gmt + "Z").getTime(),
               files: [...new Set([...html.matchAll(FILE_RE)].map(m => m[1]))],
               folders: [...new Set(html.match(FOLDER_RE) || [])] };
    });
    for (const p of wanted) {
      const html = (p.content && p.content.rendered) || "";
      const files = [...new Set([...html.matchAll(FILE_RE)].map(m => m[1]))];
      const folders = [...new Set(html.match(FOLDER_RE) || [])];
      const c = card();
      const t = document.createElement("b"); t.textContent = text(p.title.rendered); c.appendChild(t);
      const when = document.createElement("div"); when.innerHTML = "<small></small>";
      when.firstChild.textContent = new Date(p.date_gmt + "Z").toLocaleString("hi-IN"); c.appendChild(when);
      const box = document.createElement("div"); box.className = "links"; c.appendChild(box);
      files.forEach((id, i) => link(box, "https://drive.google.com/file/d/" + id + "/view", "📄 PDF " + (files.length > 1 ? i + 1 : "")));
      folders.forEach(f => link(box, f, "📁 Drive फ़ोल्डर"));
      link(box, p.link, "🔗 पोस्ट खोलें");
      if (!files.length && !folders.length) { const s = document.createElement("small"); s.textContent = "पोस्ट में Drive लिंक नहीं मिला"; box.appendChild(s); }
    }
  } catch (e) { out.innerHTML = ""; note("❌ " + e.message, "bad"); }
}
document.getElementById("go").onclick = load;
load();
</script>
</body>
</html>
